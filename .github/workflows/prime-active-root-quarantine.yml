name: Prime active-root quarantine

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-active-root-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  active-root:
    name: First-party MLX / active-root quarantine
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out the exact Prime revision
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          PRIME_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$EXACT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ ! -e ergentics-prime && ! -L ergentics-prime ]]
          git init ergentics-prime
          git -C ergentics-prime remote add origin "https://github.com/${PRIME_REPOSITORY}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${CHECKOUT_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          git -C ergentics-prime fetch --depth=1 --no-tags --no-write-fetch-head origin "$EXACT_REVISION"
          git -C ergentics-prime checkout --detach "$EXACT_REVISION"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          [[ "$(git -C ergentics-prime rev-parse HEAD)" == "$EXACT_REVISION" ]]
          [[ -z "$(git -C ergentics-prime status --porcelain=v1 --untracked-files=all)" ]]
          ! grep -Fq -- "$CHECKOUT_TOKEN" ergentics-prime/.git/config

      - name: Validate active metadata and preserved history
        working-directory: ergentics-prime
        env:
          ERGENTICS_EXACT_REVISION: ${{ env.EXACT_REVISION }}
        run: bash .github/scripts/prime-ci-active-root-quarantine.sh

      - name: Parse the changed Swift contracts without dependencies
        working-directory: ergentics-prime
        run: |
          set -euo pipefail
          for source_file in \
            Sources/PrimeLatinProposalPairCapture/PrimeLatinProposalPairCapture.swift \
            Sources/PrimeLatinProposalPairCapture/PrimeLatinProposalInputsV3.swift \
            Sources/PrimeLatinProposalPairCapture/PrimeLatinProposalPairCaptureV3.swift \
            Sources/PrimeLatinProposalPairCapture/PrimeLatinProposalInputSnapshotV3.swift \
            Sources/PrimeLatinProposalPairCaptureProbe/PrimeLatinProposalPairCaptureProbeMain.swift \
            Sources/PrimeLatinProposalGitObservation/PrimeLatinProposalGitSourceV3.swift \
            Sources/PrimeLatinProposalGitObservationProbe/PrimeLatinProposalGitObservationProbeMain.swift \
            Sources/PrimeLatinProposalProducerRevalidationObservation/PrimeLatinProposalProducerRevalidationObservationV1.swift \
            Sources/PrimeLatinProposalProducerRevalidationObservationProbe/PrimeLatinProposalProducerRevalidationObservationProbeMain.swift \
            Sources/PrimeLatinProposalIndependentReplay/PrimeLatinProposalIndependentReplayV1.swift \
            Sources/PrimeLatinProposalIndependentReplayProbe/PrimeLatinProposalIndependentReplayProbeMain.swift \
            Sources/PrimeLatinProposalValidationComposition/PrimeLatinProposalValidationCompositionV1.swift \
            Sources/PrimeLatinProposalValidationCompositionReceipt/PrimeLatinProposalValidationCompositionReceiptV1.swift \
            Sources/PrimeLatinProposalValidationCompositionReceiptPublisher/PrimeLatinProposalValidationCompositionReceiptPublisherV1.swift \
            Sources/PrimeLatinProposalAdmissionPolicy/PrimeLatinProposalAdmissionPolicyV1.swift \
            Sources/PrimeCore/PrimeNativeDecoderAuthority.swift \
            Sources/PrimeCore/PrimeNativeDecoderDerivedDelta.swift \
            Sources/PrimeCore/PrimeNativeDecoderCheckpointAuthority.swift \
            Sources/PrimeCore/PrimeNativeDecoderCheckpointCompatibilityV2Authority.swift \
            Sources/PrimeCore/PrimeNativeDecoderCheckpointV2ContainerIOAuthority.swift \
            Sources/PrimeCore/PrimeNativeDecoderCheckpointV2ContainerIOExecutionAuthority.swift \
            Sources/PrimeCore/PrimeNativeDecoderCheckpointV2ContainerIOExecutionFailureObservation.swift \
            Sources/PrimeCore/PrimeNativeDecoderMaintainedRuntimeComputeAuthority.swift \
            Sources/PrimeCore/PrimeNativeDecoderMaintainedRuntimeExecutionObservation.swift \
            Sources/PrimeCore/PrimeNativeDecoderTokenizerModelFunctionalCompatibilityAuthority.swift \
            Sources/PrimeCore/PrimeNativeDecoderTokenizerModelFunctionalCompatibilityExecutionObservation.swift \
            Sources/PrimeCore/PrimeNativeDecoderMetalRepairAuthority.swift \
            Sources/PrimeCore/PrimeNativeDecoderMetalExecutionObservation.swift \
            Sources/PrimeCore/PrimeNativeDecoderMetalExecutionObservationCorrection.swift \
            Sources/PrimeCore/PrimeNativeDecoderGateRepairExecutionObservation.swift \
            Sources/PrimeCore/PrimeNativeDecoderReviewedMainMetalExecutionObservation.swift \
            Sources/PrimeNativeDecoder/PrimeNativeGQADecoder.swift \
            Sources/PrimeNativeDecoderCheckpoint/PrimeNativeDecoderCheckpointV1.swift \
            Sources/PrimeNativeDecoderCheckpoint/PrimeNativeDecoderCheckpointV2.swift \
            Sources/PrimeNativeDecoderCheckpoint/PrimeNativeDecoderCheckpointV2ContainerIOExecutionEvidence.swift \
            Sources/PrimeNativeDecoderCheckpoint/PrimeNativeDecoderCompatibilityIdentityV2.swift \
            Sources/PrimeNativeDecoderRuntime/PrimeNativeDecoderRuntime.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalPairCaptureSourceContractTests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalPairCaptureTests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalGitSourceV3Tests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalInputSnapshotV3Tests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalInputsV3Tests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalProducerRevalidationObservationTests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalIndependentReplayV1Tests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalValidationCompositionV1Tests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalValidationCompositionReceiptV1Tests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalValidationCompositionReceiptPublisherV1Tests.swift \
            Tests/PrimeLatinProposalPairCaptureTests/PrimeLatinProposalAdmissionPolicyV1Tests.swift \
            Tests/PrimeNativeDecoderValidation/Tests/PrimeNativeDecoderTests/PrimeNativeDecoderAuthorityTests.swift \
            Tests/PrimeNativeDecoderValidation/Tests/PrimeNativeDecoderTests/PrimeNativeDecoderCheckpointTests.swift \
            Tests/PrimeNativeDecoderValidation/Tests/PrimeNativeDecoderTests/PrimeNativeGQADecoderTests.swift \
            Tests/PrimeNativeDecoderCheckpointCompatibilityV2Validation/Tests/PrimeNativeDecoderCheckpointCompatibilityV2Tests/PrimeNativeDecoderCompatibilityIdentityV2Tests.swift \
            Tests/PrimeNativeDecoderCheckpointV2IOValidation/Tests/PrimeNativeDecoderCheckpointV2IOTests/PrimeNativeDecoderCheckpointV2IOTests.swift \
            Tests/PrimeNativeDecoderCheckpointV2IOExecutionValidation/Sources/PrimeNativeDecoderCheckpointV2IOExecutionProbe/main.swift \
            Tests/PrimeNativeDecoderCheckpointV2IOExecutionValidation/Tests/PrimeNativeDecoderCheckpointV2IOExecutionAuthorityTests/PrimeNativeDecoderCheckpointV2IOExecutionAuthorityTests.swift \
            Tests/PrimeNativeDecoderCheckpointV2IOExecutionValidation/Tests/PrimeNativeDecoderCheckpointV2IOExecutionAuthorityTests/PrimeNativeDecoderCheckpointV2IOExecutionFailureObservationTests.swift \
            Tests/PrimeNativeDecoderRuntimeClosureValidation/Sources/PrimeNativeDecoderRuntimeClosureProbe/main.swift \
            Tests/PrimeNativeDecoderRuntimeClosureValidation/Tests/PrimeNativeDecoderRuntimeClosureAuthorityTests/PrimeNativeDecoderRuntimeClosureAuthorityTests.swift \
            Tests/PrimeNativeDecoderTokenizerCompatibilityValidation/Sources/PrimeNativeDecoderTokenizerCompatibilityProbe/main.swift \
            Tests/PrimeNativeDecoderTokenizerCompatibilityValidation/Tests/PrimeNativeDecoderTokenizerCompatibilityAuthorityTests/PrimeNativeDecoderTokenizerCompatibilityAuthorityTests.swift \
            Tests/PrimeCoreTests/PrimeNativeCorpusReplaySourceContractTests.swift \
            Tests/PrimeCoreTests/PrimeNativeGenerationContractSourceContractTests.swift \
            Tests/PrimeCoreTests/PrimeNativeNeuralGateContractSourceContractTests.swift \
            Tests/PrimeCoreTests/PrimeNativeNeuralGateMLXIsolationSourceContractTests.swift \
            Tests/PrimeCoreTests/PrimeNativeResolvedContractAdapterSourceContractTests.swift \
            Tests/PrimeCoreTests/PrimeSwiftSourceProvenanceTests.swift; do
            xcrun swiftc -frontend -parse "$source_file"
          done
          [[ "$(git rev-parse HEAD)" == "$EXACT_REVISION" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Validate isolated Latin capture and observation contracts
        working-directory: ergentics-prime
        env:
          ERGENTICS_EXACT_REVISION: ${{ env.EXACT_REVISION }}
        run: bash .github/scripts/prime-ci-latin-proposal-pair-capture.sh

      - name: Record the authority ceiling
        run: |
          {
            echo 'Exact-head active-root metadata and dependency-free Swift syntax checks passed.'
            echo 'The public mlx-swift-lm package and its two MLXLLM execution products are disconnected.'
            echo 'Historical comparator/accounting targets and receipts remain preserved.'
            echo 'The Latin pair capture is read-only transport validation and remains abstaining.'
            echo 'The dependency-free V3 consumer verifies canonical wire bytes and the embedded hash chain only and remains abstaining.'
            echo 'The V3 capture descriptor-safely observes an existing content-addressed receipt and its exact catalog and experiment children, then delegates those child bytes to the V3 consumer; it remains abstaining.'
            echo 'The V3 original-input snapshot descriptor-safely revalidates the exact bound repository and lab input bytes, role bindings, and output absence without publishing or authorizing anything.'
            echo 'The isolated Git-observation target uses only fixed local read-only /usr/bin/git commands to bind the exact HEAD, tree, clean staged/tracked/untracked status, bounded tracked-index inventory without assume-unchanged or skip-worktree entries, raw commit, and seven repository blobs to the recaptured input snapshot.'
            echo 'The isolated self-building producer-revalidation observer and probe compile, but hosted CI does not live-run the producer or claim revalidation completion.'
            echo 'The Prime-owned independent structural replay and process-free probe compile and run synthetic contracts without importing or invoking the producer implementation; hosted CI does not live-run external repository or lab roots.'
            echo 'The producer-revalidation and independent-replay observations remain disjoint siblings; neither observation composes the other observation’s completion claim.'
            echo 'The Prime-owned validation composition target cooperatively sequences both child captures for one request and cross-binds their observations, but hosted CI uses synthetic tests only and never live-runs that composition.'
            echo 'The pure validation-composition receipt target defines, encodes, and exactly validates only the composed receipt schema without filesystem, network, runtime, proposal-policy, or publication capability; byte-canonical encoding and durable publication remain in the PrimeCore-backed publisher.'
            echo 'The receipt publisher is compiled and exercised only against synthetic temporary artifact roots in the existing Latin test lane; hosted CI does not live-run validation capture or publish repository, lab, model, proposal, or public-network artifacts.'
            echo 'The pure internal Latin admission policy validates only the exact frozen typed receipt projection and emits typed ABSTAIN reasons for absent current liveness, the policy-classified structural fixture, and runtime decoder, dependency-closure, and initialization state not established by that receipt; it proves no artifact binding and creates no proposal packet or trial authorization.'
            echo 'Prime now owns a dependency-isolated Swift/MLXNN GQA decoder body and opaque KV cache. The additive derived-delta contract authorizes source materialization, compilation, and bounded synthetic mechanics tests only; it does not claim live Metal execution, checkpoint readiness, training, canary replacement, or product authority.'
            echo 'The frozen pre-repair checkpoint V1 target publicly binds only its historical Native-300M/Prime-byte-512 weights compatibility identity and analytic FP32 parameter catalog. Its executable borrowed-descriptor codec remains internal, exact-tiny-synthetic-only, size-capped, and non-authorizing; it is not the repaired decoder identity, and native checkpoint write/load, artifact provenance, atomic durability, runtime initialization, training, trial, canary, and product authority remain false.'
            echo 'The append-only Metal-repair contract preserves the frozen decoder/checkpoint identities, binds the pinned batched single-token RoPE defect and Prime-local explicit-offset repair, and fixes TF32-off only as a synthetic CI-mechanics policy. The repaired checkpoint identity, admitted runtime policy, exact-head hosted observation, training, and downstream authority remain false.'
            echo 'A subsequent append-only observation binds the exact committed repair head and tree plus an external Terminal run of all 44 strengthened tests with zero failures and zero skips. Its raw log and transport hashes are recorded but not retained here; GitHub-hosted execution, fresh-metallib provenance, repaired checkpoint identity, admitted runtime policy, training, and downstream authority remain false.'
            echo 'An append-only correction preserves that 44/44 Metal projection but invalidates the predecessor active-root and whole-gate-sequence completion claims: the old fixed-substring Process matcher could not distinguish ProcessInfo or inProcess metadata from the forbidden standalone Process symbol. This exact-head run observes only the corrected lexical gate scope; it does not widen Metal, runtime, checkpoint, training, or downstream authority.'
            echo 'A successor observation binds the corrected exact-head pull-request active-root and Latin gate execution. The reviewed-main Metal job remained skipped by design, so GitHub-hosted Metal, fresh-metallib provenance, runtime, checkpoint, training, and downstream authority remain false.'
            echo 'A reviewed-main successor binds the exact merged revision whose active-root, Latin, focused-contract, fresh-metallib, and 44-test live-Metal jobs passed on GitHub. It remains synthetic mechanics evidence and leaves repaired checkpoint identity, admitted runtime policy, training, and downstream authority false.'
            echo 'The repaired-source checkpoint compatibility V2 successor retains the exact V1 configuration, byte-512 tokenizer identity, and 218-entry FP32 parameter catalog while binding the repaired decoder source. It defines no V2 manifest, codec, artifact, native-profile I/O, runtime, or training authority.'
            echo 'The additive maintained-runtime closure policy and implementation bind the exact dependency, loader-candidate, Metal-device, and bounded MLX-initialization mechanics authorized for the reviewed-main lane. This active-root job does not execute that closure and grants no decoder forward, Native-300M allocation, checkpoint I/O or admission, training, trial, canary, product, or publication authority.'
            echo 'An append-only successor binds the exact reviewed-main run whose frozen 44-test Metal suite and bounded Release runtime receipt passed against one fresh pinned-source metallib and a singleton Metal device. It establishes only the maintained dependency closure, source-pinned exclusive-candidate inference, and bounded MLX initialization; independent loaded-metallib identity, decoder execution, checkpoint I/O or admission, training, and downstream authority remain false.'
            echo 'The additive tokenizer/model functional-compatibility slice authorizes the reviewed-main lane to run one fixed-seed random-initialized Native-300M allocation and one full-prefix no-cache forward for source A after the frozen 44-test and maintained-runtime predecessors. It can establish only tokenizer sequence mechanics and that process-local witness; broad model functional compatibility, model quality, checkpoint I/O or admission, training, trial, canary, product, and publication authority remain false.'
            echo 'An append-only execution observation binds the exact reviewed-main run whose tokenizer replay, 218-entry live Native-300M parameter projection, one random-initialized full-prefix forward, and finite [1,3,512] logits passed after the frozen Metal and runtime gates. It establishes only that narrow tokenizer-to-random-initialized-model witness; broad model functional or semantic compatibility, quality, checkpoint, training, trial, canary, product, and publication authority remain false.'
            echo 'The append-only V2 checkpoint container/I/O successor defines an exact weights-only manifest, caller-supplied external whole-container binding, and public Native-300M write/load codec whose filesystem capability remains inside PrimeArtifactRoot. It authorizes those bounded APIs but does not itself observe a write, load, artifact, durability outcome, checkpoint admission, runtime use, or training.'
            echo 'Hosted CI runs one isolated declarative V2 checkpoint I/O schema, mutation, source-identity, import, and capability-boundary test. That test does not call the codec, allocate Native-300M, or grant artifact, checkpoint, product, publication, trial, canary, or training authority.'
            echo 'The bounded execution successor authorizes only the first-attempt direct-main successor to run one seed-42 Native-300M V2 write and one fresh public load after its frozen predecessors, using ordered chunked receipt transport and literal ephemeral cleanup; it grants no retry, retention, upload, admission, forward, training, product, or publication authority.'
            echo 'Its exact reviewed-main attempt passed every predecessor, build, and pure-test gate and source-inferably returned from the public write, then failed at the post-write artifact-root stable-identity guard before path observation, public load, any V2 receipt marker, or supervisor cleanup; it emitted neither root snapshot nor the changed field. A separate local APFS reproduction diagnosed a two-to-three directory link-count transition when one leaf was added, not hosted-run telemetry. The run uploaded zero Actions artifacts and establishes neither retained nor admitted checkpoint state. The append-only failure observation binds that narrow outcome, retires the old live command, and restores both 45-minute timeouts and depth-one checkouts; a separately authorized seed-43 repair is the next boundary, never a rerun.'
            echo 'Hosted reviewed-main now executes exactly two isolated pure V2 I/O execution-contract tests, including exhaustive failure-observation mutation rejection. They allocate no model, call no checkpoint codec or public I/O entry point, and cannot reactivate the exhausted one-shot.'
            echo 'The locally declared origin is not network-authenticated, and ignored workspace bytes are not observed by this slice.'
            echo 'Beyond that one bounded random-initialized Native-300M witness, no Prime proposal, candidate selection, trial authorization, decision receipt, runtime/product/canary decoder activation, additional model execution, training, publication, promotion, Driver V2, or PMHNP authority is granted.'
          } >> "$GITHUB_STEP_SUMMARY"

  trusted-main-compile:
    name: Reviewed main / focused source contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: active-root
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXACT_REVISION: ${{ github.sha }}
      PRIME_MLX_REVISION: d37885a278f1c37484a94d0f401a418735e66519

    steps:
      - name: Record the hosted Apple toolchain
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Check out reviewed main exactly
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          PRIME_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$EXACT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ ! -e ergentics-prime && ! -L ergentics-prime ]]
          git init ergentics-prime
          git -C ergentics-prime remote add origin "https://github.com/${PRIME_REPOSITORY}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${CHECKOUT_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          git -C ergentics-prime fetch --depth=1 --no-tags --no-write-fetch-head origin "$EXACT_REVISION"
          git -C ergentics-prime checkout --detach "$EXACT_REVISION"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          [[ "$(git -C ergentics-prime rev-parse HEAD)" == "$EXACT_REVISION" ]]
          [[ -z "$(git -C ergentics-prime status --porcelain=v1 --untracked-files=all)" ]]
          ! grep -Fq -- "$CHECKOUT_TOKEN" ergentics-prime/.git/config

      - name: Fetch the exact private dependency without evaluating Prime
        env:
          ERGENTICS_MLX_READ_TOKEN: ${{ secrets.ERGENTICS_PAT }}
        run: |
          set -euo pipefail
          [[ -n "$ERGENTICS_MLX_READ_TOKEN" ]]
          readonly mlx_bare="$RUNNER_TEMP/ergentics-mlx-swift.git"
          readonly mlx_source="$RUNNER_TEMP/ergentics-mlx-swift"
          [[ ! -e "$mlx_bare" && ! -L "$mlx_bare" ]]
          [[ ! -e "$mlx_source" && ! -L "$mlx_source" ]]
          git init --bare "$mlx_bare"
          git --git-dir="$mlx_bare" remote add origin \
            https://github.com/Ergentics/ergentics-mlx-swift
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${ERGENTICS_MLX_READ_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          git --git-dir="$mlx_bare" fetch --depth=1 --no-tags origin "$PRIME_MLX_REVISION"
          [[ "$(git --git-dir="$mlx_bare" rev-parse FETCH_HEAD)" == "$PRIME_MLX_REVISION" ]]
          git --git-dir="$mlx_bare" update-ref refs/heads/prime-pinned "$PRIME_MLX_REVISION"
          git --git-dir="$mlx_bare" worktree add --detach "$mlx_source" "$PRIME_MLX_REVISION"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git -C "$mlx_source" submodule update --init --recursive
          [[ "$(git -C "$mlx_source" rev-parse HEAD)" == "$PRIME_MLX_REVISION" ]]
          [[ -z "$(git -C "$mlx_source" status --porcelain=v1 --untracked-files=all)" ]]
          [[ "$(git --git-dir="$mlx_bare" remote get-url origin)" == \
            'https://github.com/Ergentics/ergentics-mlx-swift' ]]
          ! grep -R -Fq -- "$ERGENTICS_MLX_READ_TOKEN" "$mlx_bare"

      - name: Compile and run the focused contracts without a credential
        working-directory: ergentics-prime
        run: |
          set -euo pipefail
          readonly mlx_bare="$RUNNER_TEMP/ergentics-mlx-swift.git"
          readonly test_log="$RUNNER_TEMP/prime-active-root-tests.log"
          readonly checkpoint_v2_test_log="$RUNNER_TEMP/prime-checkpoint-v2-tests.log"
          readonly checkpoint_v2_io_test_log="$RUNNER_TEMP/prime-checkpoint-v2-io-tests.log"
          readonly checkpoint_v2_io_execution_pure_test_log="$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-tests.log"
          [[ "$(git --git-dir="$mlx_bare" rev-parse refs/heads/prime-pinned)" == \
            "$PRIME_MLX_REVISION" ]]
          mkdir -p \
            "$RUNNER_TEMP/prime-active-root-build" \
            "$RUNNER_TEMP/prime-active-root-cache" \
            "$RUNNER_TEMP/prime-active-root-config" \
            "$RUNNER_TEMP/prime-active-root-security" \
            "$RUNNER_TEMP/prime-checkpoint-v2-build" \
            "$RUNNER_TEMP/prime-checkpoint-v2-cache" \
            "$RUNNER_TEMP/prime-checkpoint-v2-config" \
            "$RUNNER_TEMP/prime-checkpoint-v2-security" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-build" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-cache" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-config" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-security" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-build" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-cache" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-config" \
            "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-security"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="url.file://${mlx_bare}/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/Ergentics/ergentics-mlx-swift"
          export GIT_CONFIG_KEY_1="protocol.file.allow"
          export GIT_CONFIG_VALUE_1="always"
          TMPDIR="$RUNNER_TEMP" swift test \
            --scratch-path "$RUNNER_TEMP/prime-active-root-build" \
            --cache-path "$RUNNER_TEMP/prime-active-root-cache" \
            --config-path "$RUNNER_TEMP/prime-active-root-config" \
            --security-path "$RUNNER_TEMP/prime-active-root-security" \
            --disable-dependency-cache \
            --manifest-cache local \
            --disable-netrc \
            --disable-keychain \
            --force-resolved-versions \
            --test-product ErgenticsPrimePackageTests \
            --filter 'PrimeNativeNeuralGateMLXIsolationSourceContractTests|PrimeNativeCorpusReplaySourceContractTests|PrimeNativeGenerationContractSourceContractTests|PrimeNativeNeuralGateContractSourceContractTests|PrimeNativeResolvedContractAdapterSourceContractTests|PrimeSwiftSourceProvenanceTests/testLiveRepositoryMatchesEmbeddedSourceIdentity' \
            2>&1 | tee "$test_log"
          TMPDIR="$RUNNER_TEMP" swift test \
            --package-path Tests/PrimeNativeDecoderCheckpointCompatibilityV2Validation \
            --scratch-path "$RUNNER_TEMP/prime-checkpoint-v2-build" \
            --cache-path "$RUNNER_TEMP/prime-checkpoint-v2-cache" \
            --config-path "$RUNNER_TEMP/prime-checkpoint-v2-config" \
            --security-path "$RUNNER_TEMP/prime-checkpoint-v2-security" \
            --disable-dependency-cache \
            --manifest-cache local \
            --disable-netrc \
            --disable-keychain \
            --force-resolved-versions \
            2>&1 | tee "$checkpoint_v2_test_log"
          TMPDIR="$RUNNER_TEMP" swift test \
            --package-path Tests/PrimeNativeDecoderCheckpointV2IOValidation \
            --scratch-path "$RUNNER_TEMP/prime-checkpoint-v2-io-build" \
            --cache-path "$RUNNER_TEMP/prime-checkpoint-v2-io-cache" \
            --config-path "$RUNNER_TEMP/prime-checkpoint-v2-io-config" \
            --security-path "$RUNNER_TEMP/prime-checkpoint-v2-io-security" \
            --disable-dependency-cache \
            --manifest-cache local \
            --disable-netrc \
            --disable-keychain \
            --force-resolved-versions \
            2>&1 | tee "$checkpoint_v2_io_test_log"
          TMPDIR="$RUNNER_TEMP" swift test \
            --package-path Tests/PrimeNativeDecoderCheckpointV2IOExecutionValidation \
            --scratch-path "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-build" \
            --cache-path "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-cache" \
            --config-path "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-config" \
            --security-path "$RUNNER_TEMP/prime-checkpoint-v2-io-execution-pure-security" \
            --disable-dependency-cache \
            --manifest-cache local \
            --disable-netrc \
            --disable-keychain \
            --force-resolved-versions \
            2>&1 | tee "$checkpoint_v2_io_execution_pure_test_log"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          unset GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$test_log"
          grep -Fq 'Executed 1 test, with 0 failures' \
            "$checkpoint_v2_test_log"
          ! grep -Fqi -- 'skipped' "$checkpoint_v2_test_log"
          grep -Fq 'Executed 1 test, with 0 failures' \
            "$checkpoint_v2_io_test_log"
          ! grep -Fqi -- 'skipped' "$checkpoint_v2_io_test_log"
          grep -Fq 'Executed 2 tests, with 0 failures' \
            "$checkpoint_v2_io_execution_pure_test_log"
          ! grep -Fqi -- 'skipped' \
            "$checkpoint_v2_io_execution_pure_test_log"
          [[ "$(git rev-parse HEAD)" == "$EXACT_REVISION" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Run the Prime-owned decoder on live Metal
        working-directory: ergentics-prime
        run: |
          bash .github/scripts/prime-ci-native-decoder-metal.sh
          bash .github/scripts/prime-ci-native-decoder-runtime-closure.sh
          bash .github/scripts/prime-ci-native-decoder-tokenizer-compatibility.sh
